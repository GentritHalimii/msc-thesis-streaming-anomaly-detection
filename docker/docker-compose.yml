# Host ports 9092/5432 are deliberately NOT used: this machine may run other
# Kafka/Postgres containers. This stack binds 19092 (Kafka) and 15432 (Postgres).
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: sad-kafka
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 2

  postgres:
    image: postgres:16
    container_name: sad-postgres
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: anomaly
      POSTGRES_PASSWORD: anomaly
      POSTGRES_DB: anomaly
    # A named volume, so scored events and alerts survive `docker compose
    # down` and the Grafana panel still has something to show at the start of
    # a demonstration.
    volumes:
      - sad-pgdata:/var/lib/postgresql/data

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: sad-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      # Without this Grafana sends X-Frame-Options: deny and the results panel
      # can only link to the dashboard instead of showing it inline.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - postgres

volumes:
  sad-pgdata:
