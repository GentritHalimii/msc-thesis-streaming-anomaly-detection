apiVersion: 1

datasources:
  - name: Anomaly PostgreSQL
    uid: sad-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: anomaly
    isDefault: true
    jsonData:
      database: anomaly
      sslmode: disable
      postgresVersion: 1600
      maxOpenConns: 4
    secureJsonData:
      password: anomaly
