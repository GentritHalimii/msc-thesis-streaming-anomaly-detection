[project]
name = "streaming-anomaly-detection"
version = "0.1.0"
description = "M.Sc. thesis prototype: anomaly detection on simulated financial transaction streams with Apache Kafka and unsupervised ML"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "torch>=2.4",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "joblib>=1.4",
    "confluent-kafka>=2.5",
    "psycopg[binary]>=3.2",
    "psutil>=6.0",
    "scipy>=1.14",
    "optuna>=4.0",
    "shap>=0.46",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires docker services (kafka/postgres); excluded by default",
]
addopts = "-m 'not integration'"
